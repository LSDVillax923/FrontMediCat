<header class="header">
  <div class="header-container">
    <a routerLink="/inicio" class="logo">
      <img src="/img/Medicat.png" alt="Medicat logo" />
    </a>
    <nav class="nav">
      <a routerLink="/inicio" class="nav-link">Inicio</a>
      <a routerLink="/veterinarios" class="nav-link">Veterinarios</a>
    </nav>
  </div>
</header>

<main class="dashboard">
  <section class="dashboard-header">
    <h1 class="dashboard-title">Editar Veterinario</h1>
    <p class="dashboard-subtitle">Actualiza la información del profesional</p>
  </section>

  <p *ngIf="noEncontrado" class="alert alert-error">
    No se encontró el veterinario. <a routerLink="/veterinarios">Volver</a>
  </p>

  <p *ngIf="mensaje" class="alert alert-success">{{ mensaje }}</p>
  <p *ngIf="error" class="alert alert-error">{{ error }}</p>

  <div class="form-card" *ngIf="!noEncontrado">
    <form (ngSubmit)="guardarCambios()" #formVet="ngForm">
      <div class="form-grid">
        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" [(ngModel)]="formData.nombre" required />
        </div>

        <div class="form-group">
          <label for="cedula">Cédula profesional</label>
          <input type="text" id="cedula" name="cedula" [(ngModel)]="formData.cedula" required />
        </div>

        <div class="form-group">
          <label for="especialidad">Especialidad</label>
          <select id="especialidad" name="especialidad" [(ngModel)]="formData.especialidad" required>
            <option *ngFor="let esp of especialidades" [value]="esp">{{ esp }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="celular">Celular</label>
          <input type="tel" id="celular" name="celular" [(ngModel)]="formData.celular" required />
        </div>

        <div class="form-group full-width">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" [(ngModel)]="formData.correo" required />
        </div>

        <div class="form-group">
          <label for="contrasenia">Contraseña</label>
          <input type="password" id="contrasenia" name="contrasenia" [(ngModel)]="formData.contrasenia" required />
        </div>

        <div class="form-group">
          <label for="estado">Estado</label>
          <select id="estado" name="estado" [(ngModel)]="formData.estado">
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
          </select>
        </div>
      </div>

      <div class="form-acciones">
        <button type="submit" class="btn-guardar" [disabled]="formVet.invalid">
          💾 Guardar Cambios
        </button>
        <button type="button" class="btn-cancelar" (click)="cancelar()">✕ Cancelar</button>
      </div>
    </form>
  </div>
</main>
