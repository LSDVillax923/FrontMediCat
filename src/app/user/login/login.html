<main class="login-container">
  <div class="login-content">
    
    <section class="image-card position-relative d-none d-lg-block">
      <img src="img/gato.jpg" alt="Gato" class="img-fluid h-100 w-100 object-fit-cover" />
      
      <div class="image-overlay-text">
      </div>
    </section>

    <section class="form-card bg-white shadow-lg">
      <header class="mb-4">
        <a routerLink="/inicio" class="text-decoration-none text-teal small fw-semibold">
          <i class="bi bi-arrow-left"></i> Volver al inicio
        </a>
      </header>

      <div class="text-center mb-4">
        <img src="img/Medicat.png" alt="Logo" width="50" class="mb-2" />
        <h2 class="fw-bold text-teal-dark">Iniciar Sesión</h2>
        <p class="text-muted small">Ingresa tus credenciales para continuar</p>
      </div>

      <form>
        <div class="mb-3">
          <label class="form-label fw-bold small text-teal-dark">Correo Electrónico</label>
          <div class="input-group custom-input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" placeholder="tu@email.com">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold small text-teal-dark">Contraseña</label>
          <div class="input-group custom-input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" placeholder="••••••••">
            <span class="input-group-text" style="cursor: pointer;"><i class="bi bi-eye"></i></span>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label small text-muted" for="remember">Recordarme</label>
          </div>
          <a routerLink="/user/forgot-password" class="text-teal small text-decoration-none fw-medium">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <button type="submit" class="btn btn-teal-submit w-100 py-3 fs-5 fw-bold rounded-3 shadow-sm">
          Iniciar Sesión
        </button>
      </form>

      <footer class="text-center mt-4">
        <p class="small text-muted mb-0">
          ¿No tienes cuenta? 
          <a routerLink="/user/sign-up" class="text-teal fw-bold text-decoration-none">
            Regístrate aquí
          </a>
        </p>
      </footer>
    </section>

  </div>
</main>
