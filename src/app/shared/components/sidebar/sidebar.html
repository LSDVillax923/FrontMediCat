<aside class="sidebar" [class.sidebar--collapsed]="collapsed">
  <button class="sidebar__toggle" (click)="toggleSidebar()" aria-label="Colapsar menú">
    <span>{{ collapsed ? '☰' : '✕' }}</span>
  </button>

  <div class="sidebar__logo" *ngIf="!collapsed">
    <img src="/img/Medicat.png" alt="Medicat" />
  </div>

  <nav class="sidebar__nav">
    <!-- Siempre visible -->
    <a routerLink="/inicio" routerLinkActive="active" class="sidebar__link">
      <span class="sidebar__icon">🏠</span>
      <span class="sidebar__label" *ngIf="!collapsed">Inicio</span>
    </a>

    <a routerLink="/mascotas" routerLinkActive="active" class="sidebar__link">
      <span class="sidebar__icon">🐾</span>
      <span class="sidebar__label" *ngIf="!collapsed">Mascotas</span>
    </a>

    <a routerLink="/clientes" routerLinkActive="active" class="sidebar__link">
      <span class="sidebar__icon">👤</span>
      <span class="sidebar__label" *ngIf="!collapsed">Clientes</span>
    </a>

    <a routerLink="/tratamientos" routerLinkActive="active" class="sidebar__link">
      <span class="sidebar__icon">💊</span>
      <span class="sidebar__label" *ngIf="!collapsed">Tratamientos</span>
    </a>

    <!-- Solo admin -->
    <ng-container *ngIf="esAdmin">
      <div class="sidebar__divider" *ngIf="!collapsed">
        <span>Administración</span>
      </div>

      <a routerLink="/veterinarios" routerLinkActive="active" class="sidebar__link">
        <span class="sidebar__icon">🩺</span>
        <span class="sidebar__label" *ngIf="!collapsed">Veterinarios</span>
      </a>

      <a routerLink="/drogas" routerLinkActive="active" class="sidebar__link">
        <span class="sidebar__icon">🧪</span>
        <span class="sidebar__label" *ngIf="!collapsed">Inventario</span>
      </a>
    </ng-container>
  </nav>

  <!-- Info de sesión -->
  <div class="sidebar__user" *ngIf="sesion && !collapsed">
    <div class="sidebar__avatar">{{ sesion.nombre.charAt(0) }}</div>
    <div class="sidebar__user-info">
      <strong>{{ sesion.nombre }}</strong>
      <span>{{ sesion.rol }}</span>
    </div>
  </div>

  <button class="sidebar__logout" (click)="cerrarSesion()">
    <span class="sidebar__icon">🚪</span>
    <span class="sidebar__label" *ngIf="!collapsed">Cerrar sesión</span>
  </button>
</aside>
