<app-navbar></app-navbar>

<main class="dashboard">
  <section class="dashboard-header">
    <a routerLink="/drogas" class="btn-volver">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Volver a Drogas
    </a>
    <h1 class="dashboard-title">Editar Droga</h1>
    <p class="dashboard-subtitle">Actualiza la información del medicamento</p>
  </section>

  <p *ngIf="mensaje" class="alert alert-success">{{ mensaje }}</p>
  <p *ngIf="error" class="alert alert-error">{{ error }}</p>

  <div class="form-card" *ngIf="!noEncontrado">
    <form (ngSubmit)="guardarCambios()">
      <div class="form-grid">

        <div class="form-group full-width">
          <label for="nombre">Nombre del medicamento</label>
          <input type="text" id="nombre" name="nombre" [(ngModel)]="formData.nombre" required />
        </div>

        <div class="form-group full-width">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion" [(ngModel)]="formData.descripcion" rows="3"></textarea>
        </div>

        <div class="form-group">
          <label for="unidad">Unidad de medida</label>
          <input type="text" id="unidad" name="unidad" [(ngModel)]="formData.unidad" placeholder="mg, ml, comprimidos..." />
        </div>

        <div class="form-group">
          <label for="stock">Stock disponible</label>
          <input type="number" id="stock" name="stock" [(ngModel)]="formData.stock" min="0" />
        </div>

        <!-- La dosis solo la puede editar el veterinario -->
        <div class="form-group" [class.campo-bloqueado]="esAdmin">
          <label for="dosis">
            Dosis recomendada
            <span *ngIf="esAdmin" class="campo-bloqueado__aviso">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              Solo veterinarios pueden modificar este campo
            </span>
          </label>
          <input
            type="text"
            id="dosis"
            name="dosis"
            [(ngModel)]="formData.dosis"
            [disabled]="esAdmin"
            [attr.readonly]="esAdmin ? true : null"
            placeholder="Ej: 5mg por kg de peso"
          />
        </div>

      </div>

      <div class="form-acciones">
        <button type="submit" class="btn-guardar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Guardar Cambios
        </button>
        <a routerLink="/drogas" class="btn-cancelar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Cancelar
        </a>
      </div>
    </form>
  </div>
</main>
